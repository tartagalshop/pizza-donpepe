<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Don Pepe | Tartagal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f5f0;
      color: #333;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      color: white;
      text-align: center;
      padding: 30px 20px 25px;
    }

    header h1 {
      font-size: 1.9rem;
      margin-bottom: 6px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.95;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    .section-title {
      font-size: 1.3rem;
      margin: 25px 0 15px;
      color: #c0392b;
      border-bottom: 2px solid #c0392b;
      padding-bottom: 6px;
    }

    .producto {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .producto-info h3 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .producto-info p {
      font-size: 0.9rem;
      color: #666;
    }

    .precio {
      font-weight: 700;
      color: #c0392b;
      font-size: 1.15rem;
      white-space: nowrap;
    }

    .btn-pedir {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 10px;
    }

    .btn-pedir:active {
      transform: scale(0.97);
    }

    /* Botón flotante de WhatsApp */
    .whatsapp-float {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: #25D366;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      text-decoration: none;
      z-index: 100;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    <h1>Pizza Don Pepe</h1>
    <p>Las mejores pizzas de Tartagal</p>
  </header>

  <div class="container">

    <h2 class="section-title">Nuestras Pizzas</h2>

    <!-- Producto 1 -->
    <div class="producto">
      <div class="producto-info">
        <h3>Muzzarella</h3>
        <p>Clásica con mucho queso</p>
        <a href="https://wa.me/5493876123456?text=Hola! Quiero pedir una Pizza Muzzarella" class="btn-pedir">Pedir</a>
      </div>
      <div class="precio">$8500</div>
    </div>

    <!-- Producto 2 -->
    <div class="producto">
      <div class="producto-info">
        <h3>Napolitana</h3>
        <p>Tomate, ajo y orégano</p>
        <a href="https://wa.me/5493876123456?text=Hola! Quiero pedir una Pizza Napolitana" class="btn-pedir">Pedir</a>
      </div>
      <div class="precio">$9200</div>
    </div>

    <!-- Producto 3 -->
    <div class="producto">
      <div class="producto-info">
        <h3>Especial</h3>
        <p>Jamón, morrón y huevo</p>
        <a href="https://wa.me/5493876123456?text=Hola! Quiero pedir una Pizza Especial" class="btn-pedir">Pedir</a>
      </div>
      <div class="precio">$10500</div>
    </div>

    <!-- Producto 4 -->
    <div class="producto">
      <div class="producto-info">
        <h3>Fugazzeta</h3>
        <p>Cebolla y mucho queso</p>
        <a href="https://wa.me/5493876123456?text=Hola! Quiero pedir una Pizza Fugazzeta" class="btn-pedir">Pedir</a>
      </div>
      <div class="precio">$9800</div>
    </div>

  </div>

  <!-- Botón flotante de WhatsApp -->
  <a href="https://wa.me/5493876123456?text=Hola! Quiero hacer un pedido" class="whatsapp-float" target="_blank">
    <span>💬</span>
  </a>

  <footer>
    Pizza Don Pepe · Tartagal
  </footer>

</body>
</html>
